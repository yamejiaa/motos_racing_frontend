<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Transacciones - Motos Racing Quibdo</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <link rel="stylesheet" href="../css/tailwind.css" />
  </head>
  <body class="bg-ink text-white h-[100dvh] overflow-hidden">
    <div id="app-layout" class="flex h-[100dvh]">
      <div
        id="app-content"
        class="flex-1 lg:ml-72 flex flex-col h-[100dvh] min-w-0"
      >
        <main class="flex-1 overflow-y-auto p-4 sm:p-6">
          <div id="contenido-transacciones" class="hidden"></div>

          <div
            id="loader-transacciones"
            class="flex items-center justify-center py-20"
          >
            <div
              class="inline-block animate-spin rounded-full h-8 w-8 border-2 border-brand border-t-transparent"
            ></div>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal Detalles Transacción -->
    <div
      id="modal-detalles"
      class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"
    >
      <div
        class="bg-ink-soft border border-ink-border rounded-xl w-full max-w-lg max-h-[90vh] overflow-y-auto"
      >
        <div
          class="flex items-center justify-between p-4 border-b border-ink-border sticky top-0 bg-ink-soft z-10"
        >
          <h3 class="font-bold text-lg">Detalles de la transacción</h3>
          <button
            id="btn-cerrar-detalles"
            class="p-2 text-zinc-400 hover:text-white rounded-lg transition-colors"
            aria-label="Cerrar"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <div id="detalles-contenido" class="p-4">
          <div class="flex items-center justify-center py-12">
            <div
              class="inline-block animate-spin rounded-full h-8 w-8 border-2 border-brand border-t-transparent"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../js/transacciones.js"></script>
  </body>
</html>
