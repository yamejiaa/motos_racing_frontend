<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Iniciar Sesion - Motos Racing Quibdo</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/tailwind.css" />
  </head>
  <body class="min-h-screen relative">
    <div
      class="fixed inset-0 z-0 pointer-events-none"
      style="
        background-image:
          linear-gradient(rgba(22, 163, 74, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 163, 74, 0.06) 1px, transparent 1px);
        background-size: 44px 44px;
      "
    ></div>

    <main
      class="relative z-10 min-h-screen flex items-center justify-center px-4 py-8"
    >
      <div id="login-card" class="w-full max-w-md">
        <div
          class="bg-ink-soft border border-ink-border rounded-2xl p-6 sm:p-8"
        >
          <div class="flex justify-center mb-6">
            <img
              src="/logo.png"
              alt="Motos Racing Quibdo"
              class="h-28 sm:h-32 w-auto object-contain"
            />
          </div>

          <form id="form-login" novalidate>
            <div class="field mb-4">
              <input
                type="email"
                id="email"
                name="email"
                placeholder=" "
                autocomplete="email"
                required
              />
              <label for="email">Correo electronico</label>
            </div>

            <div class="field mb-4">
              <input
                type="password"
                id="password"
                name="password"
                placeholder=" "
                autocomplete="current-password"
                data-has-icon="true"
                required
              />
              <label for="password">Contrasena</label>
              <button
                type="button"
                id="btn-toggle-password"
                class="field-icon"
                aria-label="Mostrar u ocultar contrasena"
              >
                <svg
                  id="icon-eye"
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                  />
                </svg>
                <svg
                  id="icon-eye-off"
                  class="w-5 h-5 hidden"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"
                  />
                </svg>
              </button>
            </div>

            <div class="flex justify-end mb-6">
              <button
                type="button"
                id="btn-forgot"
                class="text-sm text-brand hover:text-brand-dark font-medium transition-colors"
              >
                Olvide mi contrasena
              </button>
            </div>

            <button
              type="submit"
              id="btn-submit"
              class="w-full bg-brand hover:bg-brand-dark text-white font-semibold py-3 rounded-lg transition-all duration-200 flex items-center justify-center gap-2"
            >
              <span id="btn-text">Ingresar</span>
              <svg
                id="btn-spinner"
                class="w-5 h-5 hidden animate-spin"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                />
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
                />
              </svg>
            </button>
          </form>
        </div>
      </div>
    </main>

    <!-- Modal de bienvenida -->
    <div
      id="modal-bienvenida"
      class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm"
    >
      <div
        class="w-full max-w-sm bg-ink-soft border border-ink-border rounded-2xl p-8 text-center"
      >
        <div class="flex justify-center mb-4">
          <div
            class="w-16 h-16 rounded-full bg-brand/15 flex items-center justify-center"
          >
            <svg
              class="w-9 h-9 text-brand"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </div>
        </div>
        <h2 class="text-xl font-bold mb-1">Inicio de sesion exitoso</h2>
        <p id="modal-bienvenida-nombre" class="text-sm text-zinc-500">
          Bienvenido
        </p>
      </div>
    </div>

    <!-- Modal cambio obligatorio -->
    <div
      id="modal-cambio-obligatorio"
      class="fixed inset-0 z-[200] hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm"
    >
      <div
        class="w-full max-w-md bg-ink-soft border border-ink-border rounded-2xl p-6 sm:p-8"
      >
        <h2 class="text-xl font-bold mb-6">Cambio obligatorio de contrasena</h2>

        <form id="form-cambio" novalidate>
          <div class="field mb-4">
            <input
              type="password"
              id="password-nueva"
              placeholder=" "
              autocomplete="new-password"
              required
            />
            <label for="password-nueva">Nueva contrasena</label>
          </div>

          <div class="field mb-4">
            <input
              type="password"
              id="password-confirmar"
              placeholder=" "
              autocomplete="new-password"
              required
            />
            <label for="password-confirmar">Confirmar contrasena</label>
          </div>

          <div class="mb-4">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs text-zinc-500">Fortaleza</span>
              <span
                id="fortaleza-texto"
                class="text-xs font-medium text-zinc-500"
                >Muy debil</span
              >
            </div>
            <div class="flex gap-1 mb-3">
              <div
                class="flex-1 h-1 rounded-full bg-ink-border transition-all"
                data-bar="0"
              ></div>
              <div
                class="flex-1 h-1 rounded-full bg-ink-border transition-all"
                data-bar="1"
              ></div>
              <div
                class="flex-1 h-1 rounded-full bg-ink-border transition-all"
                data-bar="2"
              ></div>
              <div
                class="flex-1 h-1 rounded-full bg-ink-border transition-all"
                data-bar="3"
              ></div>
            </div>
            <ul id="lista-requisitos" class="space-y-1.5"></ul>
          </div>

          <button
            type="submit"
            class="w-full bg-brand hover:bg-brand-dark text-white font-semibold py-3 rounded-lg transition-all"
          >
            Establecer contrasena
          </button>
        </form>
      </div>
    </div>

    <!-- Modal OLVIDE MI CONTRASEÑA (con floating label igual al resto) -->
    <div
      id="modal-forgot"
      class="fixed inset-0 z-[300] hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm"
    >
      <div
        class="w-full max-w-md bg-ink-soft border border-ink-border rounded-2xl p-6 sm:p-8"
      >
        <h2 class="text-xl font-bold mb-2">Recuperar contrasena</h2>
        <p class="text-sm text-zinc-500 mb-6">
          Ingresa tu correo. Solo cuentas bloqueadas permanentemente pueden
          restablecer su contrasena.
        </p>

        <form id="form-forgot" novalidate>
          <div class="field mb-6">
            <input
              type="email"
              id="forgot-email"
              placeholder=" "
              autocomplete="email"
              required
            />
            <label for="forgot-email">Correo electronico</label>
          </div>

          <div class="flex gap-3">
            <button
              type="button"
              id="btn-cancel-forgot"
              class="flex-1 bg-transparent border border-ink-border hover:border-brand text-white font-semibold py-3 rounded-lg transition-all"
            >
              Cancelar
            </button>
            <button
              type="submit"
              id="btn-enviar-forgot"
              class="flex-1 bg-brand hover:bg-brand-dark text-white font-semibold py-3 rounded-lg transition-all"
            >
              Enviar enlace
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="../js/login.js"></script>
  </body>
</html>
