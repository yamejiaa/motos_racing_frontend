<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Mantenimientos - Motos Racing Quibdo</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <link rel="stylesheet" href="../css/tailwind.css" />
    <link rel="stylesheet" href="../js/fechas.css" />
  </head>
  <body class="bg-ink text-white h-[100dvh] overflow-hidden">
    <div id="app-layout" class="flex h-[100dvh]">
      <div
        id="app-content"
        class="flex-1 lg:ml-72 flex flex-col h-[100dvh] min-w-0"
      >
        <main class="flex-1 overflow-y-auto p-4 sm:p-6">
          <div id="vista-lista" class="hidden">
            <div id="tabla-mantenimientos"></div>
          </div>

          <div id="vista-kanban" class="hidden">
            <div id="kanban-contenido"></div>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal crear mantenimiento -->
    <div
      id="modal-mantenimiento"
      class="fixed inset-0 z-[500] hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm"
    >
      <div
        class="w-full max-w-4xl bg-ink-soft border border-ink-border rounded-2xl max-h-[95vh] flex flex-col"
      >
        <div
          class="flex items-center justify-between px-6 py-4 border-b border-ink-border shrink-0"
        >
          <h2 id="modal-mantenimiento-titulo" class="text-lg font-bold">
            Nuevo mantenimiento
          </h2>
        </div>

        <form
          id="form-mantenimiento"
          class="flex-1 overflow-y-auto px-6 py-5"
          novalidate
        >
          <input type="hidden" id="mantenimiento-id" />

          <!-- ─── SECCION 1: Cliente y moto ─── -->
          <section class="mb-8">
            <h3
              class="text-sm font-bold text-brand mb-4 flex items-center gap-2"
            >
              <span
                class="w-6 h-6 rounded-full bg-brand/20 flex items-center justify-center text-xs"
                >1</span
              >
              Cliente y moto
            </h3>

            <!-- Checkbox No es cliente -->
            <label
              class="flex items-center gap-3 cursor-pointer bg-ink border border-ink-border rounded-lg p-3 mb-4 hover:border-brand transition-colors"
            >
              <input
                type="checkbox"
                id="check-no-es-cliente"
                class="w-5 h-5 accent-brand"
              />
              <div>
                <p class="text-sm text-white font-medium">No es cliente</p>
                <p class="text-xs text-zinc-500">
                  Marcar para registrar un cliente y moto nuevos
                </p>
              </div>
            </label>

            <!-- Buscador por placa (cliente existente) -->
            <div id="seccion-cliente-existente">
              <div class="relative mb-4">
                <div class="field">
                  <input
                    type="text"
                    id="mantenimiento-placa"
                    placeholder=" "
                    autocomplete="off"
                  />
                  <label for="mantenimiento-placa">Placa de la moto</label>
                </div>
                <div
                  id="resultados-placa"
                  class="hidden mt-1.5 bg-ink border border-ink-border rounded-lg shadow-2xl max-h-72 overflow-y-auto"
                ></div>
              </div>

              <div
                id="moto-seleccionada-info"
                class="hidden bg-ink border border-brand/30 rounded-xl p-4 mb-4"
              >
                <div class="flex items-start justify-between gap-3">
                  <div class="min-w-0">
                    <p
                      class="text-xs text-brand font-mono mb-1"
                      id="moto-info-placa"
                    >
                      -
                    </p>
                    <p class="text-white font-medium" id="moto-info-nombre">
                      -
                    </p>
                    <p
                      class="text-xs text-zinc-500 mt-1"
                      id="moto-info-cliente"
                    >
                      -
                    </p>
                    <p class="text-xs text-zinc-500" id="moto-info-telefono">
                      -
                    </p>
                  </div>
                  <button
                    type="button"
                    id="btn-cambiar-moto"
                    class="text-xs text-zinc-500 hover:text-brand shrink-0"
                  >
                    Cambiar
                  </button>
                </div>
                <input type="hidden" id="mantenimiento-moto-id" />
              </div>

              <div id="btn-nueva-moto-container" class="hidden mb-4">
                <p class="text-sm text-zinc-400 mb-3">
                  Esta placa no esta registrada. Activa "No es cliente" para
                  registrarla.
                </p>
              </div>
            </div>

            <!-- Seccion cliente nuevo (cuando "No es cliente" esta marcado) -->
            <div id="seccion-cliente-nuevo" class="hidden">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div class="field">
                  <input
                    type="text"
                    id="nuevo-cliente-nombre"
                    placeholder=" "
                  />
                  <label for="nuevo-cliente-nombre">Nombre completo</label>
                </div>
                <div class="field">
                  <input
                    type="text"
                    id="nuevo-cliente-telefono"
                    placeholder=" "
                    inputmode="numeric"
                    maxlength="10"
                  />
                  <label for="nuevo-cliente-telefono">Telefono</label>
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div class="field">
                  <input
                    type="text"
                    id="nuevo-moto-placa"
                    placeholder=" "
                    autocomplete="off"
                  />
                  <label for="nuevo-moto-placa">Placa de la moto</label>
                </div>
                <div class="field">
                  <input type="text" id="nuevo-moto-marca" placeholder=" " />
                  <label for="nuevo-moto-marca">Marca</label>
                </div>
              </div>

              <div class="field mb-4">
                <input type="text" id="nuevo-moto-modelo" placeholder=" " />
                <label for="nuevo-moto-modelo">Modelo</label>
              </div>

              <input type="hidden" id="nuevo-moto-id" />
            </div>
          </section>

          <!-- ─── SECCION 2: Datos del mantenimiento ─── -->
          <section class="mb-8">
            <h3
              class="text-sm font-bold text-brand mb-4 flex items-center gap-2"
            >
              <span
                class="w-6 h-6 rounded-full bg-brand/20 flex items-center justify-center text-xs"
                >2</span
              >
              Datos del mantenimiento
            </h3>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
              <div class="field">
                <input
                  type="text"
                  id="mantenimiento-kilometraje"
                  placeholder=" "
                  inputmode="numeric"
                  required
                />
                <label for="mantenimiento-kilometraje">Kilometraje</label>
              </div>

              <div class="field">
                <input
                  type="text"
                  id="mantenimiento-fecha-promesa"
                  placeholder=" "
                  class="input-fecha"
                />
                <label for="mantenimiento-fecha-promesa"
                  >Fecha promesa de entrega</label
                >
                <button
                  type="button"
                  class="btn-fecha-hoy field-icon"
                  data-target="mantenimiento-fecha-promesa"
                  title="Usar fecha actual"
                >
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <circle cx="12" cy="12" r="9" stroke-width="2" />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <div class="mb-4">
              <label
                class="block text-xs text-zinc-500 mb-1.5 font-medium uppercase tracking-wider"
                >Mecanico asignado</label
              >
              <div class="relative" data-dropdown-mecanico>
                <button
                  type="button"
                  class="mecanico-dropdown-toggle w-full bg-ink border border-ink-border rounded-lg px-4 py-3 text-sm text-white flex items-center justify-between gap-2 hover:border-brand transition-all"
                >
                  <span class="mecanico-dropdown-label text-zinc-500"
                    >Seleccionar mecanico...</span
                  >
                  <svg
                    class="w-4 h-4 shrink-0 text-zinc-500 mecanico-dropdown-chevron transition-transform"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M19 9l-7 7-7-7"
                    />
                  </svg>
                </button>
                <input type="hidden" id="mantenimiento-mecanico-id" />
                <div
                  class="mecanico-dropdown-menu hidden absolute z-50 mt-1.5 w-full bg-ink-soft border border-ink-border rounded-lg shadow-2xl py-1.5 max-h-64 overflow-y-auto"
                >
                  <div
                    class="px-3 pb-2 pt-1 sticky top-0 bg-ink-soft border-b border-ink-border"
                  >
                    <input
                      type="text"
                      class="mecanico-dropdown-search w-full bg-ink border border-ink-border rounded-lg px-3 py-2 text-sm text-white placeholder-zinc-500 focus:border-brand transition-all"
                      placeholder="Buscar mecanico..."
                    />
                  </div>
                  <div class="mecanico-dropdown-list"></div>
                </div>
              </div>
            </div>

            <div class="field mb-4">
              <textarea
                id="mantenimiento-motivo"
                placeholder=" "
                rows="2"
              ></textarea>
              <label for="mantenimiento-motivo">Motivo de ingreso</label>
            </div>

            <div class="field mb-4">
              <textarea
                id="mantenimiento-diagnostico"
                placeholder=" "
                rows="2"
              ></textarea>
              <label for="mantenimiento-diagnostico"
                >Diagnostico (opcional)</label
              >
            </div>
          </section>

          <!-- ─── SECCION 3: Imagenes ─── -->
          <section class="mb-8">
            <h3
              class="text-sm font-bold text-brand mb-4 flex items-center gap-2"
            >
              <span
                class="w-6 h-6 rounded-full bg-brand/20 flex items-center justify-center text-xs"
                >3</span
              >
              Imagenes (obligatorias)
            </h3>

            <div
              id="dropzone-imagenes"
              class="border-2 border-dashed border-ink-border rounded-xl p-6 text-center hover:border-brand transition-all cursor-pointer"
            >
              <svg
                class="w-10 h-10 mx-auto text-zinc-500 mb-3"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                />
              </svg>
              <p class="text-sm text-zinc-400 mb-1">
                Arrastra imagenes aqui o haz clic para seleccionar
              </p>
              <p class="text-xs text-zinc-500">
                JPG, PNG o WEBP - Maximo 5 MB por imagen
              </p>
            </div>

            <label for="input-imagenes" class="sr-only"
              >Subir imagenes de la moto</label
            >
            <input
              type="file"
              id="input-imagenes"
              name="imagenes"
              accept="image/*"
              multiple
              class="hidden"
            />

            <div
              id="preview-imagenes"
              class="grid grid-cols-3 sm:grid-cols-4 gap-2 mt-4"
            ></div>
          </section>

          <!-- ─── SECCION 4: Observaciones ─── -->
          <section class="mb-4">
            <h3
              class="text-sm font-bold text-brand mb-4 flex items-center gap-2"
            >
              <span
                class="w-6 h-6 rounded-full bg-brand/20 flex items-center justify-center text-xs"
                >4</span
              >
              Observaciones
            </h3>

            <div class="field mb-4">
              <textarea
                id="mantenimiento-observaciones"
                placeholder=" "
                rows="3"
              ></textarea>
              <label for="mantenimiento-observaciones">Observaciones</label>
            </div>
          </section>
        </form>

        <div class="px-6 py-4 border-t border-ink-border flex gap-3 shrink-0">
          <button
            type="button"
            id="btn-cancelar-mantenimiento"
            class="flex-1 bg-transparent border border-ink-border hover:border-brand text-white font-semibold py-3 rounded-lg transition-all"
          >
            Cancelar
          </button>
          <button
            type="submit"
            form="form-mantenimiento"
            id="btn-guardar-mantenimiento"
            class="flex-1 bg-brand hover:bg-brand-dark text-white font-semibold rounded-lg transition-all"
          >
            Crear mantenimiento
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="../js/mantenimientos.js"></script>
  </body>
</html>
