<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Restablecer Contrasena - Motos Racing Quibdo</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/tailwind.css" />
  </head>
  <body class="min-h-screen relative">
    <div
      class="fixed inset-0 z-0 pointer-events-none"
      style="
        background-image:
          linear-gradient(rgba(22, 163, 74, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(22, 163, 74, 0.06) 1px, transparent 1px);
        background-size: 44px 44px;
      "
    ></div>

    <main
      class="relative z-10 min-h-screen flex items-center justify-center px-4 py-8"
    >
      <div class="w-full max-w-md">
        <div
          class="bg-ink-soft border border-ink-border rounded-2xl p-6 sm:p-8"
        >
          <div class="flex justify-center mb-6">
            <img
              src="/logo.png"
              alt="Motos Racing Quibdo"
              class="h-24 sm:h-28 w-auto object-contain"
            />
          </div>

          <!-- Estado inicial: verificando -->
          <div id="estado-verificando" class="text-center py-6">
            <div
              class="inline-block animate-spin rounded-full h-8 w-8 border-2 border-brand border-t-transparent"
            ></div>
            <p class="text-sm text-zinc-500 mt-4">Verificando enlace...</p>
          </div>

          <!-- Estado invalido -->
          <div id="estado-invalido" class="hidden text-center py-6">
            <div
              class="w-16 h-16 rounded-full bg-red-500/15 flex items-center justify-center mx-auto mb-4"
            >
              <svg
                class="w-9 h-9 text-red-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <circle cx="12" cy="12" r="10" stroke-width="2" />
                <line
                  x1="12"
                  y1="8"
                  x2="12"
                  y2="12"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <line
                  x1="12"
                  y1="16"
                  x2="12.01"
                  y2="16"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <h2 id="estado-invalido-titulo" class="text-lg font-bold mb-2">
              Enlace invalido o expirado
            </h2>
            <p id="estado-invalido-mensaje" class="text-sm text-zinc-500 mb-6">
              Solicita uno nuevo desde el inicio de sesion.
            </p>
            <a
              href="/src/pages/login.html"
              class="inline-block bg-brand hover:bg-brand-dark text-white font-semibold py-3 px-6 rounded-lg transition-all"
            >
              Volver al inicio
            </a>
          </div>

          <!-- Formulario -->
          <div id="estado-formulario" class="hidden">
            <form id="form-restablecer" novalidate>
              <div class="field mb-4">
                <input
                  type="password"
                  id="password-nueva"
                  placeholder=" "
                  autocomplete="new-password"
                  required
                />
                <label for="password-nueva">Nueva contrasena</label>
              </div>

              <div class="field mb-4">
                <input
                  type="password"
                  id="password-confirmar"
                  placeholder=" "
                  autocomplete="new-password"
                  required
                />
                <label for="password-confirmar">Confirmar contrasena</label>
              </div>

              <div class="mb-4">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs text-zinc-500">Fortaleza</span>
                  <span
                    id="fortaleza-texto"
                    class="text-xs font-medium text-zinc-500"
                    >Muy debil</span
                  >
                </div>
                <div class="flex gap-1 mb-3">
                  <div
                    class="flex-1 h-1 rounded-full bg-ink-border transition-all"
                    data-bar="0"
                  ></div>
                  <div
                    class="flex-1 h-1 rounded-full bg-ink-border transition-all"
                    data-bar="1"
                  ></div>
                  <div
                    class="flex-1 h-1 rounded-full bg-ink-border transition-all"
                    data-bar="2"
                  ></div>
                  <div
                    class="flex-1 h-1 rounded-full bg-ink-border transition-all"
                    data-bar="3"
                  ></div>
                </div>
                <ul id="lista-requisitos" class="space-y-1.5"></ul>
              </div>

              <button
                type="submit"
                id="btn-submit"
                class="w-full bg-brand hover:bg-brand-dark text-white font-semibold py-3 rounded-lg transition-all"
              >
                Restablecer contrasena
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="../js/restablecer.js"></script>
  </body>
</html>
