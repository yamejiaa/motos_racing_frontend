<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Proveedores - Motos Racing Quibdo</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <link rel="stylesheet" href="../css/tailwind.css" />
  </head>
  <body class="bg-ink text-white h-[100dvh] overflow-hidden">
    <div id="app-layout" class="flex h-[100dvh]">
      <div
        id="app-content"
        class="flex-1 lg:ml-72 flex flex-col h-[100dvh] min-w-0"
      >
        <main class="flex-1 overflow-y-auto p-4 sm:p-6">
          <div id="contenido-proveedores" class="hidden"></div>

          <div
            id="loader-proveedores"
            class="flex items-center justify-center py-20"
          >
            <div
              class="inline-block animate-spin rounded-full h-8 w-8 border-2 border-brand border-t-transparent"
            ></div>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal Crear/Editar Proveedor -->
    <div
      id="modal-proveedor"
      class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"
    >
      <div
        class="bg-ink-soft border border-ink-border rounded-xl w-full max-w-lg max-h-[90vh] overflow-y-auto"
      >
        <div
          class="flex items-center p-4 border-b border-ink-border sticky top-0 bg-ink-soft z-10"
        >
          <h3 id="modal-proveedor-titulo" class="font-bold text-lg">
            Nuevo Proveedor
          </h3>
        </div>

        <form id="form-proveedor" class="p-4 space-y-4">
          <input type="hidden" id="proveedor-id" />

          <div class="field">
            <input
              type="text"
              id="prov-nombre"
              placeholder=" "
              required
              maxlength="150"
            />
            <label for="prov-nombre">Nombre</label>
          </div>

          <div class="field">
            <input type="text" id="prov-nit" placeholder=" " maxlength="30" />
            <label for="prov-nit">NIT</label>
          </div>

          <div class="field">
            <input
              type="tel"
              id="prov-telefono"
              placeholder=" "
              required
              maxlength="20"
            />
            <label for="prov-telefono">Teléfono</label>
          </div>

          <div class="field">
            <input type="email" id="prov-email" placeholder=" " />
            <label for="prov-email">Email</label>
          </div>

          <div class="field">
            <input type="text" id="prov-direccion" placeholder=" " />
            <label for="prov-direccion">Dirección</label>
          </div>

          <div class="field">
            <input type="text" id="prov-contacto" placeholder=" " />
            <label for="prov-contacto">Persona de contacto</label>
          </div>

          <div class="field">
            <input type="text" id="prov-productos" placeholder=" " />
            <label for="prov-productos">Productos que provee</label>
          </div>

          <div class="field">
            <textarea id="prov-notas" placeholder=" "></textarea>
            <label for="prov-notas">Notas</label>
          </div>

          <div class="flex gap-3 pt-2">
            <button
              type="button"
              id="btn-cancelar-proveedor"
              class="flex-1 btn-secondary"
            >
              Cancelar
            </button>
            <button
              type="submit"
              id="btn-guardar-proveedor"
              class="flex-1 btn-primary"
            >
              Guardar
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="../js/proveedores.js"></script>
  </body>
</html>
