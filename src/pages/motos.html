<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Motos - Motos Racing Quibdo</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <link rel="stylesheet" href="../css/tailwind.css" />
  </head>
  <body class="bg-ink text-white h-[100dvh] overflow-hidden">
    <div id="app-layout" class="flex h-[100dvh]">
      <div
        id="app-content"
        class="flex-1 lg:ml-72 flex flex-col h-[100dvh] min-w-0"
      >
        <main class="flex-1 overflow-y-auto p-4 sm:p-6">
          <div id="tabla-motos"></div>
        </main>
      </div>
    </div>

    <!-- Modal historial de moto -->
    <div
      id="modal-historial"
      class="fixed inset-0 z-[500] hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm"
    >
      <div
        class="w-full max-w-3xl bg-ink-soft border border-ink-border rounded-2xl max-h-[90vh] flex flex-col"
      >
        <div
          class="flex items-center justify-between px-6 py-4 border-b border-ink-border shrink-0"
        >
          <div class="min-w-0">
            <h2 id="modal-historial-titulo" class="text-lg font-bold truncate">
              Historial
            </h2>
            <p
              id="modal-historial-subtitulo"
              class="text-xs text-zinc-500 truncate"
            >
              -
            </p>
          </div>
          <button
            id="btn-cerrar-historial"
            class="p-1 text-zinc-500 hover:text-white shrink-0"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <div id="historial-contenido" class="flex-1 overflow-y-auto px-6 py-5">
          <!-- Se llena dinamicamente -->
        </div>
      </div>
    </div>

    <script type="module" src="../js/motos.js"></script>
  </body>
</html>
