<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Dashboard - Motos Racing Quibdo</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <link rel="stylesheet" href="../css/tailwind.css" />
  </head>
  <body class="bg-ink text-white h-[100dvh] overflow-hidden">
    <div id="app-layout" class="flex h-[100dvh]">
      <div
        id="app-content"
        class="flex-1 lg:ml-72 flex flex-col h-[100dvh] min-w-0"
      >
        <main class="flex-1 overflow-y-auto p-4 sm:p-6">
          <div id="contenido-dashboard" class="hidden">
            <div
              class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-3 sm:gap-4 mb-6"
            >
              <div
                class="bg-ink-soft border border-ink-border rounded-xl p-4 card-stat"
                data-stat="clientes"
              >
                <p
                  class="text-[10px] sm:text-xs text-zinc-500 uppercase tracking-wider mb-2"
                >
                  Clientes
                </p>
                <p class="text-xl sm:text-2xl font-bold" data-valor>0</p>
              </div>
              <div
                class="bg-ink-soft border border-ink-border rounded-xl p-4 card-stat"
                data-stat="motos"
              >
                <p
                  class="text-[10px] sm:text-xs text-zinc-500 uppercase tracking-wider mb-2"
                >
                  Motos
                </p>
                <p class="text-xl sm:text-2xl font-bold" data-valor>0</p>
              </div>
              <div
                class="bg-ink-soft border border-ink-border rounded-xl p-4 card-stat"
                data-stat="mecanicosActivos"
              >
                <p
                  class="text-[10px] sm:text-xs text-zinc-500 uppercase tracking-wider mb-2"
                >
                  Mecanicos
                </p>
                <p class="text-xl sm:text-2xl font-bold" data-valor>0</p>
              </div>
              <div
                class="bg-ink-soft border border-ink-border rounded-xl p-4 card-stat"
                data-stat="mantenimientosActivos"
              >
                <p
                  class="text-[10px] sm:text-xs text-zinc-500 uppercase tracking-wider mb-2"
                >
                  En taller
                </p>
                <p class="text-xl sm:text-2xl font-bold" data-valor>0</p>
              </div>
              <div
                class="bg-ink-soft border border-ink-border rounded-xl p-4 card-stat"
                data-stat="mantenimientosTotales"
              >
                <p
                  class="text-[10px] sm:text-xs text-zinc-500 uppercase tracking-wider mb-2"
                >
                  Mantenim.
                </p>
                <p class="text-xl sm:text-2xl font-bold" data-valor>0</p>
              </div>
              <div
                class="bg-ink-soft border border-ink-border rounded-xl p-4 card-stat"
                data-stat="repuestosBajoStock"
              >
                <p
                  class="text-[10px] sm:text-xs text-zinc-500 uppercase tracking-wider mb-2"
                >
                  Bajo stock
                </p>
                <p class="text-xl sm:text-2xl font-bold" data-valor>0</p>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 mb-6">
              <div class="bg-ink-soft border border-ink-border rounded-xl p-5">
                <p class="text-xs text-zinc-500 uppercase tracking-wider mb-2">
                  Ingresos
                </p>
                <p
                  id="stat-ingresos"
                  class="text-xl sm:text-2xl font-bold text-brand"
                >
                  $0
                </p>
              </div>
              <div class="bg-ink-soft border border-ink-border rounded-xl p-5">
                <p class="text-xs text-zinc-500 uppercase tracking-wider mb-2">
                  Egresos
                </p>
                <p
                  id="stat-egresos"
                  class="text-xl sm:text-2xl font-bold text-red-500"
                >
                  $0
                </p>
              </div>
              <div class="bg-ink-soft border border-ink-border rounded-xl p-5">
                <p class="text-xs text-zinc-500 uppercase tracking-wider mb-2">
                  Balance
                </p>
                <p id="stat-balance" class="text-xl sm:text-2xl font-bold">
                  $0
                </p>
              </div>
            </div>

            <div class="bg-ink-soft border border-ink-border rounded-xl p-5">
              <h3 class="font-bold mb-4">Ranking de mecanicos</h3>
              <div
                id="ranking-mecanicos"
                class="space-y-3 text-sm text-zinc-500"
              >
                Cargando...
              </div>
            </div>
          </div>

          <div
            id="loader-dashboard"
            class="flex items-center justify-center py-20"
          >
            <div
              class="inline-block animate-spin rounded-full h-8 w-8 border-2 border-brand border-t-transparent"
            ></div>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="../js/dashboard.js"></script>
  </body>
</html>
