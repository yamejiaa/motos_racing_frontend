<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Cambiar Contraseña - Motos Racing Quibdo</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <link rel="stylesheet" href="../css/tailwind.css" />
  </head>
  <body class="bg-ink text-white h-[100dvh] overflow-hidden">
    <div id="app-layout" class="flex h-[100dvh]">
      <div
        id="app-content"
        class="flex-1 lg:ml-72 flex flex-col h-[100dvh] min-w-0"
      >
        <main class="flex-1 overflow-y-auto p-4 sm:p-6">
          <div id="contenido-password" class="hidden max-w-2xl mx-auto">
            <!-- Aviso de seguridad -->
            <div
              class="bg-blue-500/10 border border-blue-500/30 rounded-xl p-4 mb-6 flex gap-3"
            >
              <svg
                class="w-5 h-5 text-blue-400 shrink-0 mt-0.5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
              <div class="text-sm">
                <p class="font-medium text-blue-400 mb-1">
                  Recomendaciones de seguridad
                </p>
                <ul class="text-blue-300/80 text-xs space-y-0.5">
                  <li>• Mínimo 8 caracteres</li>
                  <li>• Al menos una mayúscula y una minúscula</li>
                  <li>• Al menos un número</li>
                </ul>
              </div>
            </div>

            <!-- Formulario -->
            <div
              class="bg-ink-soft border border-ink-border rounded-xl p-5 sm:p-6"
            >
              <div class="flex items-center gap-3 mb-5">
                <span
                  class="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-brand/10"
                >
                  <svg
                    class="w-5 h-5 text-brand"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                    />
                  </svg>
                </span>
                <div>
                  <h2 class="font-bold text-lg">Cambiar contraseña</h2>
                  <p class="text-xs text-zinc-500">
                    Actualiza tu contraseña de acceso
                  </p>
                </div>
              </div>

              <form id="form-password" class="space-y-4">
                <!-- Contraseña actual -->
                <div class="field">
                  <input
                    type="password"
                    id="pass-actual"
                    placeholder=" "
                    autocomplete="current-password"
                    required
                  />
                  <label for="pass-actual">Contraseña actual</label>
                  <button
                    type="button"
                    class="field-icon"
                    data-toggle-password="pass-actual"
                    aria-label="Mostrar contraseña"
                  >
                    <svg
                      class="w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                  </button>
                </div>

                <!-- Nueva contraseña -->
                <div class="field">
                  <input
                    type="password"
                    id="pass-nueva"
                    placeholder=" "
                    autocomplete="new-password"
                    required
                  />
                  <label for="pass-nueva">Nueva contraseña</label>
                  <button
                    type="button"
                    class="field-icon"
                    data-toggle-password="pass-nueva"
                    aria-label="Mostrar contraseña"
                  >
                    <svg
                      class="w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                  </button>
                </div>

                <!-- Confirmar contraseña -->
                <div class="field">
                  <input
                    type="password"
                    id="pass-confirmar"
                    placeholder=" "
                    autocomplete="new-password"
                    required
                  />
                  <label for="pass-confirmar">Confirmar nueva contraseña</label>
                  <button
                    type="button"
                    class="field-icon"
                    data-toggle-password="pass-confirmar"
                    aria-label="Mostrar contraseña"
                  >
                    <svg
                      class="w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                      />
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                      />
                    </svg>
                  </button>
                </div>

                <!-- Barra de fuerza -->
                <div id="fuerza-password" class="hidden">
                  <div class="flex gap-1.5 mb-1.5">
                    <div
                      class="fuerza-bar flex-1 h-1 rounded-full bg-ink-border transition-all"
                    ></div>
                    <div
                      class="fuerza-bar flex-1 h-1 rounded-full bg-ink-border transition-all"
                    ></div>
                    <div
                      class="fuerza-bar flex-1 h-1 rounded-full bg-ink-border transition-all"
                    ></div>
                    <div
                      class="fuerza-bar flex-1 h-1 rounded-full bg-ink-border transition-all"
                    ></div>
                  </div>
                  <p id="fuerza-texto" class="text-xs text-zinc-500">
                    Ingresa una contraseña
                  </p>
                </div>

                <!-- Botón -->
                <div
                  class="flex justify-end pt-4 mt-6 border-t border-ink-border"
                >
                  <button
                    type="submit"
                    id="btn-guardar-password"
                    class="btn-primary flex items-center gap-2"
                  >
                    <svg
                      class="w-5 h-5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M5 13l4 4L19 7"
                      />
                    </svg>
                    Cambiar contraseña
                  </button>
                </div>
              </form>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="../js/cambiar-password.js"></script>
  </body>
</html>
